# =============================================================================
# ARQUIVO DE EXEMPLO — ele NÃO roda a partir daqui.
#
# Para ativar, copie este arquivo para o SEU repositório pessoal em:
#
#     .github/workflows/ci.yml
#
# O GitHub Actions só executa workflows que estejam em `.github/workflows/`
# na raiz do repositório. Dentro de `semana-05/codigo/github-actions/` ele é
# só material de estudo — é de propósito, para o repositório do grupo não sair
# tentando publicar imagem no GCP de ninguém.
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Gatilhos: todo push na main e todo pull request que aponte para a main.
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -----------------------------------------------------------------------------
# Permissão mínima no nível do workflow. O job que publica a imagem pede
# `id-token: write` separadamente — princípio do menor privilégio.
# -----------------------------------------------------------------------------
permissions:
  contents: read

# -----------------------------------------------------------------------------
# Cancela execuções antigas da mesma branch/PR: economiza minutos de Actions.
# -----------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A mesma versão da imagem base do Dockerfile (python:3.12-slim): testar numa
  # versão e publicar em outra é pedir para o bug aparecer só em produção.
  PYTHON_VERSION: "3.12"
  # Ajuste os três valores abaixo para o seu projeto.
  GCP_REGION: us-central1
  AR_REPOSITORY: mlops-estudos
  IMAGE_NAME: api-sentimento

jobs:
  # ===========================================================================
  # 1) LINT — estilo e erros óbvios, antes de gastar tempo com teste.
  # ===========================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Cacheia o diretório do pip entre execuções (CI mais rápido).
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check (erros de lint)
        run: ruff check .

      - name: ruff format --check (formatação)
        run: ruff format --check .

  # ===========================================================================
  # 2) TEST — a suíte pytest da API de sentimento.
  # ===========================================================================
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -v

  # ===========================================================================
  # 3) BUILD + PUSH — só acontece em push na main, e só se lint e teste passaram.
  #    Em pull request este job é pulado: PR não publica imagem.
  # ===========================================================================
  build-and-push:
    name: Build e push no Artifact Registry
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # Necessário para o Workload Identity Federation: o Actions emite um
      # token OIDC e o GCP troca esse token por credencial temporária.
      # Sem isso, só sobraria chave JSON de service account (pior).
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Autenticação no Google Cloud via Workload Identity Federation.
      #
      # Configure antes (ver `semana-05/codigo/scripts/`) e cadastre em
      # Settings > Secrets and variables > Actions > Variables:
      #
      #   GCP_PROJECT_ID     ex.: meu-projeto-mlops
      #   GCP_WIF_PROVIDER   projects/<NUMERO>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      #   GCP_SERVICE_ACCOUNT  github-actions@<PROJECT_ID>.iam.gserviceaccount.com
      #
      # ALTERNATIVA (pior, só se o WIF não sair): gerar uma chave JSON da
      # service account, salvar em Secrets como GCP_SA_KEY e trocar o bloco
      # `with:` abaixo por `credentials_json: ${{ secrets.GCP_SA_KEY }}`.
      # A chave é um segredo de longa duração: se vazar, vale até ser revogada.
      # -----------------------------------------------------------------------
      - name: Autenticar no Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Instalar o gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Ensina o Docker a usar a credencial do gcloud para o host do registry.
      - name: Configurar o Docker para o Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # -----------------------------------------------------------------------
      # Tag = SHA do commit. É isso que liga a imagem em produção a uma linha
      # de código: `docker inspect` na imagem → SHA → commit → PR → discussão.
      # A tag `latest` é conveniência; nunca use `latest` para rastrear.
      # -----------------------------------------------------------------------
      - name: Montar o nome da imagem
        id: imagem
        run: |
          IMAGEM="${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPOSITORY}/${IMAGE_NAME}"
          echo "imagem=${IMAGEM}" >> "$GITHUB_OUTPUT"
          echo "Imagem: ${IMAGEM}:${GITHUB_SHA}"

      - name: Build da imagem
        run: |
          docker build \
            --tag "${{ steps.imagem.outputs.imagem }}:${{ github.sha }}" \
            --tag "${{ steps.imagem.outputs.imagem }}:latest" \
            .

      # Teste de fumaça: sobe o container e bate no /health antes de publicar.
      # Imagem que não responde não chega ao registry.
      - name: Smoke test da imagem
        run: |
          docker run --rm --detach --name api-teste --publish 8000:8000 \
            "${{ steps.imagem.outputs.imagem }}:${{ github.sha }}"
          for tentativa in $(seq 1 10); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API respondeu."
              docker stop api-teste
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu em /health."
          docker logs api-teste
          docker stop api-teste
          exit 1

      - name: Push para o Artifact Registry
        run: |
          docker push "${{ steps.imagem.outputs.imagem }}:${{ github.sha }}"
          docker push "${{ steps.imagem.outputs.imagem }}:latest"

      # Deixa o link e a tag visíveis no resumo da execução no GitHub.
      - name: Resumo da execução
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo '```'
            echo "${{ steps.imagem.outputs.imagem }}:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
