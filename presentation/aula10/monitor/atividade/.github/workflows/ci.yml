name: Pipeline MLOps - Aula 10

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixar o código
    - name: Checkout do Código
      uses: actions/checkout@v3

    # 2. Configurar Python
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instalar Dependências
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Linting (Qualidade de Código)
    - name: Verificar Estilo (Linting)
      run: |
        # Para o teste se tornar "real", falhamos o build se houver erros graves
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos (warnings) são permitidos
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Treinamento Automatizado
    - name: Treinar Modelo
      run: python src/train.py

    # 6. Testes Automatizados
    - name: Executar Testes
      run: pytest tests/

    # 7. Build da Imagem Docker
    - name: Build da Imagem Docker
      run: docker build -t ml-app-ufg:${{ github.sha }} .
    
    # 8. (Opcional) Push para Registry
    # Aqui apenas simulamos o passo de push
    - name: Simular Push para Registry
      run: echo "Docker Image ml-app-ufg:${{ github.sha }} pushada com sucesso!"