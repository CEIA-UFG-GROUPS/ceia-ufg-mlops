version: "3.8"

services:
  # Airflow em modo "standalone" (webserver + scheduler + triggerer em um único
  # processo, com metadados em SQLite) — suficiente para fins didáticos locais.
  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: airflow-pipeline-treinamento
    command: standalone
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - SIMULAR_FALHA_TRANSITORIA=${SIMULAR_FALHA_TRANSITORIA:-}
    volumes:
      - ../data:/opt/airflow/data
      - ../models:/opt/airflow/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
