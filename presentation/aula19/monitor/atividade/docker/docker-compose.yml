version: "3.8"

services:
  # Servidor central de MLflow Tracking, Model Registry e Proxy HTTP de Artefatos
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mlflow-registry-server
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --artifacts-destination /app/mlruns
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - MLFLOW_ALLOWED_HOSTS=*
    volumes:
      - mlflow-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Servidor de Inferência FastAPI (consome 'models:/ModeloClassificacao@champion')
  model-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: model-serving-api
    command: uvicorn src.service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    depends_on:
      mlflow-server:
        condition: service_healthy
    volumes:
      - mlflow-data:/app

volumes:
  mlflow-data:
